name: Update Hugging Face downloads

on:
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * *"

permissions:
  contents: write

concurrency:
  group: update-hf-downloads
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Update download statistics
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/update_downloads.py

      - name: Commit updated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/downloads.json

          if git diff --cached --quiet; then
            echo "Download statistics have not changed."
            exit 0
          fi

          git commit -m "chore: update Hugging Face downloads"
          git push
